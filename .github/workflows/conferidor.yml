# ──────────────────────────────────────────────────────────────────────────────
# ⚠️  WORKFLOW DESCONTINUADO
# Este workflow foi substituído por: telegram_bot.yml
# O conferidor.py agora está integrado ao telegram_bot.py (modo --ci),
# que envia notificações direto no Telegram com resultado e conferência.
# ──────────────────────────────────────────────────────────────────────────────
name: "[Descontinuado] Conferidor de Loteria"

on:
  # Mantido apenas para disparo manual de emergência (conferência sem Telegram)
  workflow_dispatch:

jobs:
  conferir-legado:
    name: Conferência Legada (sem Telegram)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar o Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ▶️ Executar Conferência de Jogos (legado)
        run: python conferidor.py
